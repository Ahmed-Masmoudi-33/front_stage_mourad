<aside class="gate" *ngIf="visible">
  <div class="gate-header">
    <mat-icon>gavel</mat-icon>
    <div>
      <h3>Human approval required</h3>
      <p>{{ jiraKey }} · risk: {{ riskLevel || 'unknown' }}</p>
    </div>
  </div>
  <ul class="risk-reasons" *ngIf="riskReasons.length">
    <li *ngFor="let reason of riskReasons">{{ reason }}</li>
  </ul>
  <pre class="plan">{{ plan || 'No plan text available.' }}</pre>
  <div class="actions">
    <button mat-stroked-button color="warn" [disabled]="busy" (click)="cancel.emit()">Cancel run</button>
    <button mat-flat-button color="primary" [disabled]="busy" (click)="approve.emit()">
      Approve & continue
    </button>
  </div>
</aside>
